# values-prod.yaml
# Production overrides for the frontend chart.

replicaCount: 4

image:
  repository: registry.example.com/project/frontend
  tag: "stable"
  pullPolicy: IfNotPresent

service:
  type: ClusterIP
  port: 80
  targetPort: 8080

ingress:
  enabled: true
  ingressClassName: nginx
  hosts:
    - host: frontend.example.com
      paths:
        - path: /
          pathType: Prefix
  tls:
    - secretName: frontend-tls
      hosts:
        - frontend.example.com
  annotations:
    kubernetes.io/ingress.class: nginx
    cert-manager.io/cluster-issuer: letsencrypt-prod
    nginx.ingress.kubernetes.io/proxy-body-size: "8m"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "600"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "600"

resources:
  requests:
    cpu: 250m
    memory: 256Mi
  limits:
    cpu: 1000m
    memory: 1Gi

autoscaling:
  enabled: true
  minReplicas: 3
  maxReplicas: 10
  targetCPUUtilizationPercentage: 60

env:
  - name: BACKEND_URL
    value: "https://backend.prod.svc.cluster.local:8080"
  - name: LOG_LEVEL
    value: "warn"
  - name: FEATURE_FLAG_UI
    value: "true"

config:
  UI_THEME: "dark"
  WELCOME_MESSAGE: "Welcome to the production frontend"

podSecurityContext:
  runAsUser: 1000
  runAsGroup: 2000
  fsGroup: 2000

securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop:
      - ALL

serviceAccount:
  create: true
  name: frontend-sa

pdb:
  enabled: true
  minAvailable: 2

metrics:
  enabled: true
  path: /metrics
  port: 9100

secrets:
  useSealedSecrets: true
  sealedSecretName: frontend-api-credentials

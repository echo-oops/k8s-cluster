{{- /*
ConfigMap for backend application configuration.
Values are taken from .Values.config map.
*/ -}}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "backend.fullname" . }}-config
  labels:
    {{ include "backend.labels" . | nindent 4 }}
data:
{{- if .Values.config }}
{{- range $k, $v := .Values.config }}
  {{ $k }}: {{ $v | quote }}
{{- end }}
{{- else }}
  APP_ENV: {{ default "production" .Values.config.APP_ENV | quote }}
{{- end }}

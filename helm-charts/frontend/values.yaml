# values.yaml (development / default)
# Sensible defaults for local or staging environments.
# CI/CD should override image.tag with commit SHA.

replicaCount: 2

image:
  repository: registry.example.com/project/frontend
  tag: "latest"
  pullPolicy: IfNotPresent

service:
  type: ClusterIP
  port: 80
  targetPort: 8080
  annotations: {}

ingress:
  enabled: true
  ingressClassName: nginx
  hosts:
    - host: frontend.local
      paths:
        - path: /
          pathType: Prefix
  tls: []
  annotations:
    kubernetes.io/ingress.class: nginx
    nginx.ingress.kubernetes.io/proxy-body-size: "8m"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "600"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "600"

resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: 200m
    memory: 256Mi

autoscaling:
  enabled: false
  minReplicas: 2
  maxReplicas: 6
  targetCPUUtilizationPercentage: 60

env:
  - name: BACKEND_URL
    value: "http://backend.default.svc.cluster.local:8080"
  - name: LOG_LEVEL
    value: "info"
  - name: FEATURE_FLAG_UI
    value: "false"

config:
  UI_THEME: "light"
  WELCOME_MESSAGE: "Welcome to the demo frontend"

readinessProbe:
  httpGet:
    path: /health
    port: 8080
  initialDelaySeconds: 5
  periodSeconds: 10
  timeoutSeconds: 2
  failureThreshold: 3
  successThreshold: 1

livenessProbe:
  httpGet:
    path: /live
    port: 8080
  initialDelaySeconds: 15
  periodSeconds: 20
  timeoutSeconds: 3
  failureThreshold: 5
  successThreshold: 1

podSecurityContext:
  runAsUser: 1000
  runAsGroup: 2000
  fsGroup: 2000

securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop:
      - ALL

serviceAccount:
  create: true
  name: frontend-sa
  annotations: {}

podLabels:
  app.kubernetes.io/name: frontend
  app.kubernetes.io/instance: frontend

metrics:
  enabled: true
  path: /metrics
  port: 9100

affinity: {}
tolerations: []

pdb:
  enabled: false
  minAvailable: 1

extraVolumes: []
extraVolumeMounts: []

podAnnotations: {}

secrets:
  useSealedSecrets: true
  sealedSecretName: frontend-api-credentials

# Notes:
# - For production override image.tag and increase resources/replicas.
# - Use SealedSecrets to store any sensitive values referenced by the chart.

# values.yaml (development / default)
# Realistic, ready-to-use defaults for local/staging environments.
# Override image.repository and image.tag in CI/CD pipeline.

replicaCount: 2

image:
  repository: registry.example.com/project/backend
  tag: "latest"
  pullPolicy: IfNotPresent
  # imagePullSecrets: [] # e.g. ["regcred"] - set in values or via --set

service:
  type: ClusterIP
  port: 8080
  targetPort: 8080
  # Expose a separate metrics port for Prometheus scraping if needed
  metricsPort: 9100
  annotations: {}

resources:
  requests:
    cpu: 150m
    memory: 192Mi
  limits:
    cpu: 300m
    memory: 384Mi

autoscaling:
  enabled: false
  minReplicas: 2
  maxReplicas: 5
  targetCPUUtilizationPercentage: 60

# Environment variables passed to the container (can be overridden)
env:
  - name: DATABASE_URL
    value: "postgres://db.default.svc.cluster.local:5432/appdb"
  - name: LOG_LEVEL
    value: "info"
  - name: METRICS_ENABLED
    value: "true"

# ConfigMap entries (application config)
config:
  APP_ENV: "development"
  FEATURE_FLAG_EXAMPLE: "false"

# Probes
readinessProbe:
  httpGet:
    path: /health
    port: 8080
  initialDelaySeconds: 5
  periodSeconds: 10
  timeoutSeconds: 2
  failureThreshold: 3
  successThreshold: 1

livenessProbe:
  httpGet:
    path: /live
    port: 8080
  initialDelaySeconds: 15
  periodSeconds: 20
  timeoutSeconds: 3
  failureThreshold: 5
  successThreshold: 1

# Pod security and runtime constraints
podSecurityContext:
  runAsUser: 1001
  runAsGroup: 2001
  fsGroup: 2001

securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop:
      - ALL

# ServiceAccount settings
serviceAccount:
  create: true
  name: backend-sa
  annotations: {}

# Network policy labels (used by infrastructure/network-policies)
podLabels:
  app.kubernetes.io/name: backend
  app.kubernetes.io/instance: backend

# Ingress configuration (optional)
ingress:
  enabled: false
  ingressClassName: nginx
  hosts:
    - host: backend.local
      paths:
        - path: /
          pathType: Prefix
  tls: [] # - secretName: backend-tls; hosts: [backend.example.com]
  annotations:
    kubernetes.io/ingress.class: nginx

# ServiceMonitor configuration for Prometheus (kube-prometheus-stack)
serviceMonitor:
  enabled: true
  namespace: monitoring
  interval: 15s
  scrapeTimeout: 10s
  metricRelabelings: []
  relabelings: []
  # The ServiceMonitor will select the service by labels below
  selector:
    matchLabels:
      app: backend-backend

# Pod affinity/anti-affinity and tolerations (sensible defaults)
affinity: {}
tolerations: []

# Horizontal Pod Disruption Budget (optional)
pdb:
  enabled: false
  minAvailable: 1

# Extra volumes and mounts (for secrets, config, certificates)
extraVolumes: []
extraVolumeMounts: []

# Annotations to add to pods
podAnnotations: {}

# Extra args for the container command
extraArgs: []

# Liveness/readiness initial backoff for slow-starting apps
startupProbe: null

# Enable metrics endpoint (application must expose /metrics)
metrics:
  enabled: true
  path: /metrics
  port: 9100

# SealedSecrets or external secrets integration
# If using SealedSecrets, create a SealedSecret named backend-db-secret in the same namespace
secrets:
  useSealedSecrets: true
  sealedSecretName: backend-db-credentials

# Notes:
# - For production, override image.tag with CI_COMMIT_SHORT_SHA or release tag.
# - Use values-prod.yaml for production overrides (replica count, resources, persistence).

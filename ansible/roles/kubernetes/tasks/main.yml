# File: ansible/roles/kubernetes/tasks/main.yml
---
# Main tasks for kubernetes role
# Idempotентный плейбук, покрывающий подготовку ОС, установку containerd, kubeadm/kubelet/kubectl,
# инициализацию control-plane и присоединение воркеров.

- name: Ensure running on supported OS (Ubuntu)
  ansible.builtin.assert:
    that:
      - ansible_facts['os_family'] == "Debian"
      - "'Ubuntu' in ansible_facts['distribution']"
    fail_msg: "This role supports Ubuntu 22.04 (Debian family) only."
    success_msg: "OS check passed."

- name: Update apt cache if requested
  ansible.builtin.apt:
    update_cache: yes
  when: apt_update_cache | default(true)

- name: Install prerequisite packages
  ansible.builtin.apt:
    name: "{{ extra_packages }}"
    state: present
    update_cache: yes

- name: Disable swap immediately
  ansible.builtin.command: swapoff -a
  changed_when: false
  register: swapoff_result
  failed_when: false

- name: Ensure swap is disabled in /etc/fstab
  ansible.builtin.replace:
    path: /etc/fstab
    regexp: '(^.*\sswap\s.*$)'
    replace: '# \\1'
    backup: yes
  when: swapoff_result is defined

- name: Ensure br_netfilter module is loaded
  ansible.builtin.modprobe:
    name: br_netfilter
    state: present

- name: Ensure required sysctl settings are present
  ansible.builtin.sysctl:
    name: "{{ item.key }}"
    value: "{{ item.value }}"
    state: present
    reload: yes
  loop: "{{ sysctl_settings | dict2items }}"
  loop_control:
    label: "{{ item.key }}"

- name: Add Kubernetes apt key
  ansible.builtin.apt_key:
    url: "{{ kubernetes_apt_key_url }}"
    state: present

- name: Add Kubernetes apt repository
  ansible.builtin.apt_repository:
    repo: "{{ kubernetes_apt_repo }}"
    state: present
    filename: kubernetes

- name: Install containerd prerequisites
  ansible.builtin.apt:
    name:
      - software-properties-common
    state: present

- name: Add Docker apt repository (for containerd)
  ansible.builtin.apt_repository:
    repo: "deb [arch=amd64] https://download.docker.com/linux/ubuntu {{ ansible_lsb.codename }} stable"
    state: present
    filename: docker

- name: Update apt cache after adding repos
  ansible.builtin.apt:
    update_cache: yes

- name: Install containerd
  ansible.builtin.apt:
    name: containerd
    state: present

- name: Create containerd config directory
  ansible.builtin.file:
    path: "{{ containerd_config_path | dirname }}"
    state: directory
    mode: '0755'

- name: Generate containerd default config
  ansible.builtin.command: containerd config default
  register: containerd_default_config
  changed_when: false

- name: Write containerd config file
  ansible.builtin.copy:
    dest: "{{ containerd_config_path }}"
    content: "{{ containerd_default_config.stdout }}"
    owner: root
    group: root
    mode: '0644'
  notify: Restart containerd

- name: Ensure containerd service enabled and started
  ansible.builtin.service:
    name: containerd
    state: started
    enabled: yes

- name: Install Kubernetes packages (kubelet, kubeadm, kubectl)
  ansible.builtin.apt:
    name:
      - "kubelet={{ kubernetes_package_versions.kubelet }}"
      - "kubeadm={{ kubernetes_package_versions.kubeadm }}"
      - "kubectl={{ kubernetes_package_versions.kubectl }}"
    state: present
    update_cache: yes

- name: Hold Kubernetes packages to prevent accidental upgrades
  ansible.builtin.apt:
    name:
      - kubelet
      - kubeadm
      - kubectl
    state: present
    mark: hold
  when: apt_hold_kubernetes | default(true)

- name: Ensure kubelet service is enabled
  ansible.builtin.service:
    name: kubelet
    enabled: yes
    state: started

- name: Create kubeadm config from template (control-plane only)
  ansible.builtin.template:
    src: "{{ kubeadm_config_template }}"
    dest: "{{ kubeadm_config_path }}"
    owner: root
    group: root
    mode: '0644'
  when: is_control_plane | bool

- name: Initialize control-plane with kubeadm (only if not already initialized)
  ansible.builtin.command: >
    kubeadm init --config {{ kubeadm_config_path }} --upload-certs
  args:
    creates: "{{ kubeconfig_dest }}"
    warn: false
  register: kubeadm_init
  environment:
    KUBECONFIG: "{{ kubeconfig_dest }}"
  when:
    - is_control_plane | bool

- name: Ensure admin kubeconfig is present and has correct permissions
  ansible.builtin.file:
    path: "{{ kubeconfig_dest }}"
    owner: root
    group: root
    mode: '0600'
  when: is_control_plane | bool

- name: Copy kubeconfig to user home (for kube_user) if control-plane
  ansible.builtin.file:
    path: "/home/{{ kube_user }}/.kube"
    state: directory
    owner: "{{ kube_user }}"
    group: "{{ kube_user }}"
    mode: '0700'
  when: is_control_plane | bool

- name: Copy admin.conf to user's kube config
  ansible.builtin.copy:
    src: "{{ kubeconfig_dest }}"
    dest: "/home/{{ kube_user }}/.kube/config"
    owner: "{{ kube_user }}"
    group: "{{ kube_user }}"
    mode: '0600'
  when: is_control_plane | bool

- name: Install CNI plugin (Calico) on control-plane (apply manifest)
  ansible.builtin.command: >
    kubectl apply -f {{ cni_manifest_url }}
  environment:
    KUBECONFIG: "{{ kubeconfig_dest }}"
  register: cni_apply
  changed_when: cni_apply.rc == 0
  failed_when: cni_apply.rc not in [0,1]
  when: is_control_plane | bool

- name: Generate kubeadm join command and save to file (control-plane)
  ansible.builtin.shell: |
    kubeadm token create --print-join-command > {{ kubeadm_join_cmd_file }}
    chmod 0600 {{ kubeadm_join_cmd_file }}
  args:
    creates: "{{ kubeadm_join_cmd_file }}"
  when: is_control_plane | bool

- name: Read join command from control-plane file (if present)
  ansible.builtin.slurp:
    src: "{{ kubeadm_join_cmd_file }}"
  register: join_cmd_file
  when:
    - not is_control_plane | bool
    - join_command == ""

- name: Set join_command fact from slurped file (if available)
  ansible.builtin.set_fact:
    join_command: "{{ (join_cmd_file.content | b64decode).strip() }}"
  when:
    - not is_control_plane | bool
    - join_command == ""
    - join_cmd_file is defined
    - join_cmd_file.content is defined

- name: Fail if join_command is not provided on worker
  ansible.builtin.fail:
    msg: >
      "No join_command provided for worker node. Provide 'join_command' variable or ensure control-plane created {{ kubeadm_join_cmd_file }} and is accessible via hostvars."
  when:
    - not is_control_plane | bool
    - join_command == ""

- name: Execute kubeadm join on worker (idempotent)
  ansible.builtin.command: >
    {{ join_command }} --v=5
  args:
    creates: /var/lib/kubelet/kubeadm-flags.env
    warn: false
  register: kubeadm_join
  failed_when: kubeadm_join.rc != 0 and "'already' not in kubeadm_join.stderr"
  when: not is_control_plane | bool

- name: Wait for node to be Ready (control-plane waits for all nodes)
  ansible.builtin.command: >
    kubectl get nodes --no-headers
  environment:
    KUBECONFIG: "{{ kubeconfig_dest }}"
  register: nodes_list
  retries: 10
  delay: 15
  until: nodes_list.stdout is defined
  when: is_control_plane | bool

- name: Optionally install Helm on control-plane host
  ansible.builtin.shell: |
    curl -fsSL https://raw.githubusercontent.com/helm/helm/main/scripts/get-helm-3 | bash
  args:
    creates: /usr/local/bin/helm
  when:
    - is_control_plane | bool
    - install_helm | bool

- name: Create ci-deployer ServiceAccount and Role (optional)
  ansible.builtin.copy:
    dest: /tmp/ci-deployer.yaml
    content: |
      apiVersion: v1
      kind: ServiceAccount
      metadata:
        name: ci-deployer
        namespace: default
      ---
      apiVersion: rbac.authorization.k8s.io/v1
      kind: Role
      metadata:
        name: ci-deploy-role
        namespace: default
      rules:
        - apiGroups: [""]
          resources: ["pods","pods/log","services","configmaps","secrets","serviceaccounts","events"]
          verbs: ["get","list","watch","create","update","patch","delete"]
        - apiGroups: ["apps"]
          resources: ["deployments","statefulsets","daemonsets"]
          verbs: ["get","list","watch","create","update","patch","delete"]
      ---
      apiVersion: rbac.authorization.k8s.io/v1
      kind: RoleBinding
      metadata:
        name: ci-deploy-binding
        namespace: default
      subjects:
        - kind: ServiceAccount
          name: ci-deployer
          namespace: default
      roleRef:
        kind: Role
        name: ci-deploy-role
        apiGroup: rbac.authorization.k8s.io
  when:
    - is_control_plane | bool
    - ci_deployer_create | bool

- name: Apply ci-deployer manifest (if created)
  ansible.builtin.command: kubectl apply -f /tmp/ci-deployer.yaml
  environment:
    KUBECONFIG: "{{ kubeconfig_dest }}"
  when:
    - is_control_plane | bool
    - ci_deployer_create | bool

- name: Clean up temporary files
  ansible.builtin.file:
    path: /tmp/ci-deployer.yaml
    state: absent
  when:
    - is_control_plane | bool
    - ci_deployer_create | bool

- name: Ensure kubelet is running after join/init
  ansible.builtin.service:
    name: kubelet
    state: started
    enabled: yes

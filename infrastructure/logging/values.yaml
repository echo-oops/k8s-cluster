# values.yaml
# Helm values for installing Loki (grafana/loki) and Promtail (grafana/promtail) in a production-ready on-prem cluster.
# This file configures Loki with boltdb-shipper (filesystem store) and local persistence.
# For cloud object storage (S3/GCS/Azure) replace filesystem sections with appropriate object_store config and store credentials in a Kubernetes Secret.
#
# Usage:
#   helm repo add grafana https://grafana.github.io/helm-charts
#   helm repo update
#   helm upgrade --install loki grafana/loki -n logging --create-namespace -f infrastructure/logging/values.yaml
#   helm upgrade --install promtail grafana/promtail -n logging -f infrastructure/logging/values.yaml
#
# Security note:
#   - Store any sensitive credentials (S3 keys, auth tokens) in Kubernetes Secrets or SealedSecrets and reference them via envFrom or secretKeyRef.
#   - Ensure RBAC and network policies restrict access to the logging namespace and services.

# -------------------------
# Loki server configuration
# -------------------------
loki:
  enabled: true
  fullnameOverride: loki
  image:
    repository: grafana/loki
    tag: 2.8.2
    pullPolicy: IfNotPresent

  # Service configuration
  service:
    type: ClusterIP
    port: 3100
    annotations: {}

  # Persistence configuration (filesystem + boltdb-shipper)
  persistence:
    enabled: true
    accessModes:
      - ReadWriteOnce
    size: 100Gi
    storageClassName: standard

  # Loki runtime configuration (boltdb-shipper + filesystem)
  config:
    auth_enabled: false
    server:
      http_listen_port: 3100
      grpc_listen_port: 9095
    ingester:
      lifecycler:
        address: 127.0.0.1
        ring:
          kvstore:
            store: memberlist
        final_sleep: 0s
      chunk_idle_period: 5m
      chunk_retain_period: 30s
      max_transfer_retries: 0
    memberlist:
      join_members:
        - loki-0.loki-headless.logging.svc.cluster.local
    schema_config:
      configs:
        - from: 2020-10-24
          store: boltdb-shipper
          object_store: filesystem
          schema: v11
          index:
            prefix: index_
            period: 24h
    storage_config:
      boltdb_shipper:
        active_index_directory: /data/loki/index
        cache_location: /data/loki/cache
        shared_store: filesystem
      filesystem:
        directory: /data/loki/chunks
    table_manager:
      retention_deletes_enabled: true
      retention_period: 720h # 30 days retention by default

  # Limits and tenant configuration
  limits_config:
    enforce_metric_name: false
    reject_old_samples: true
    reject_old_samples_max_age: 168h # 7 days for sample rejection threshold

  # Resources for Loki pods
  resources:
    requests:
      cpu: 500m
      memory: 1Gi
    limits:
      cpu: 2000m
      memory: 6Gi

  # StatefulSet configuration (3 replicas recommended for HA)
  statefulset:
    enabled: true
    replicas: 3
    podManagementPolicy: Parallel
    updateStrategy:
      type: RollingUpdate

  # Headless service for memberlist
  headless:
    enabled: true
    port: 3100

  # Readiness and liveness probes
  readinessProbe:
    httpGet:
      path: /ready
      port: 3100
    initialDelaySeconds: 10
    periodSeconds: 10
    timeoutSeconds: 5

  livenessProbe:
    httpGet:
      path: /ready
      port: 3100
    initialDelaySeconds: 30
    periodSeconds: 20
    timeoutSeconds: 5

  # Pod security context and security context
  podSecurityContext:
    fsGroup: 1000
  securityContext:
    runAsUser: 1000
    runAsNonRoot: true
    allowPrivilegeEscalation: false

  # ServiceMonitor for Prometheus (if using kube-prometheus-stack)
  serviceMonitor:
    enabled: true
    namespace: monitoring
    interval: 30s
    labels:
      release: prometheus

# -------------------------
# Index Gateway (optional)
# -------------------------
indexGateway:
  enabled: false

# -------------------------
# Distributor / Querier / Ruler
# -------------------------
distributor:
  enabled: true

querier:
  enabled: true
  resources:
    requests:
      cpu: 200m
      memory: 512Mi
    limits:
      cpu: 1000m
      memory: 2Gi

ruler:
  enabled: false

# -------------------------
# Promtail configuration
# -------------------------
promtail:
  enabled: true
  fullnameOverride: promtail
  image:
    repository: grafana/promtail
    tag: 2.8.2
    pullPolicy: IfNotPresent

  # Promtail runs as a DaemonSet to collect logs from all nodes
  daemonset:
    enabled: true
    tolerations:
      - key: node-role.kubernetes.io/control-plane
        operator: Exists
        effect: NoSchedule
      - key: node-role.kubernetes.io/master
        operator: Exists
        effect: NoSchedule
    resources:
      requests:
        cpu: 100m
        memory: 200Mi
      limits:
        cpu: 500m
        memory: 512Mi

  # Promtail config: scrape pods and system logs
  config:
    clients:
      - url: http://loki.logging.svc.cluster.local:3100/loki/api/v1/push
    positions:
      filename: /run/promtail/positions.yaml
    server:
      http_listen_port: 9080
      grpc_listen_port: 0
    scrape_configs:
      - job_name: kubernetes-pods-apps
        pipeline_stages:
          - docker: {}
          - match:
              selector: '{namespace!="kube-system", namespace!="monitoring", namespace!="logging"}'
              action: keep
        kubernetes_sd_configs:
          - role: pod
        relabel_configs:
          - source_labels: [__meta_kubernetes_pod_label_app_kubernetes_io_name]
            target_label: app
          - source_labels: [__meta_kubernetes_namespace]
            target_label: namespace
          - source_labels: [__meta_kubernetes_pod_name]
            target_label: pod
          - source_labels: [__meta_kubernetes_pod_container_name]
            target_label: container
          - action: labelmap
            regex: __meta_kubernetes_pod_label_(.+)
          - source_labels: [__meta_kubernetes_pod_annotation_promtail_io_scrape]
            regex: "false"
            action: drop
      - job_name: kubernetes-system
        kubernetes_sd_configs:
          - role: pod
        relabel_configs:
          - source_labels: [__meta_kubernetes_namespace]
            regex: kube-system
            action: keep
          - action: labelmap
            regex: __meta_kubernetes_pod_label_(.+)

  # Node-level scraping (journald, varlog)
  extraScrapeConfigs: |
    - job_name: system-journal
      static_configs:
        - targets: ['localhost']
          labels:
            job: system-journal
      pipeline_stages:
        - cri: {}
      relabel_configs:
        - source_labels: ['__address__']
          target_label: __host__

  # RBAC and service account
  serviceAccount:
    create: true
    name: promtail-sa

  # DaemonSet service configuration
  service:
    annotations: {}
    type: ClusterIP

  # Persistence for positions file (optional)
  persistence:
    enabled: false
    size: 1Gi
    storageClassName: standard

# -------------------------
# Ingress (optional) for Loki/Grafana endpoints
# -------------------------
ingress:
  enabled: false
  annotations: {}
  hosts:
    - host: loki.logging.example.com
      paths:
        - path: /
          pathType: Prefix
  tls: []

# -------------------------
# Security and secrets
# -------------------------
# If using S3 or other object store, create a Kubernetes Secret named 'loki-storage-secret' in the logging namespace:
# kubectl create secret generic loki-storage-secret --from-literal=aws_access_key_id=XXX --from-literal=aws_secret_access_key=YYY -n logging
#
# Example object_store config (replace filesystem above):
# storage_config:
#   aws:
#     s3: s3://bucket-name/loki
#     region: us-east-1
#     access_key_id: ${AWS_ACCESS_KEY_ID}
#     secret_access_key: ${AWS_SECRET_ACCESS_KEY}
#
# In production, reference secrets via envFrom or secretKeyRef and avoid embedding credentials in values.yaml.

# -------------------------
# NetworkPolicy recommendations
# -------------------------
# It is recommended to create NetworkPolicies to:
#  - Allow promtail DaemonSet to talk to Loki service (TCP 3100)
#  - Allow Prometheus to scrape Loki metrics (if enabled)
#  - Restrict access to Loki/Grafana endpoints to monitoring namespace or specific ingress
#
# Example (apply separately):
# apiVersion: networking.k8s.io/v1
# kind: NetworkPolicy
# metadata:
#   name: allow-promtail-to-loki
#   namespace: logging
# spec:
#   podSelector:
#     matchLabels:
#       app.kubernetes.io/name: loki
#   ingress:
#     - from:
#         - namespaceSelector:
#             matchLabels:
#               kubernetes.io/metadata.name: logging
#           podSelector:
#             matchLabels:
#               app.kubernetes.io/name: promtail
#       ports:
#         - protocol: TCP
#           port: 3100

# -------------------------
# Helm chart hooks and lifecycle
# -------------------------
lifecycle:
  preStop:
    exec:
      command:
        - /bin/sh
        - -c
        - "sleep 5"

# -------------------------
# Notes
# -------------------------
# - Adjust replica counts, resources and storage sizes to match your cluster capacity.
# - For high-availability, run Loki as a StatefulSet with at least 3 replicas and ensure persistent volumes are provisioned.
# - Monitor Loki disk usage and retention; configure retention_period to meet compliance and cost requirements.
